<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bookGradient)"/>

  <!-- Open book -->
  <g transform="translate(50, 50)">
    <!-- Left page -->
    <path d="M -25 -15 Q -25 -10 -25 0 L -25 15 Q -25 18 -20 18 L -2 18 L -2 -15 Z"
          fill="#ffffff" opacity="0.95"/>

    <!-- Right page -->
    <path d="M 25 -15 Q 25 -10 25 0 L 25 15 Q 25 18 20 18 L 2 18 L 2 -15 Z"
          fill="#ffffff" opacity="0.95"/>

    <!-- Spine shadow -->
    <rect x="-1" y="-15" width="2" height="33" fill="#2c3e50" opacity="0.2"/>

    <!-- Left page lines -->
    <line x1="-20" y1="-8" x2="-8" y2="-8" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="-3" x2="-8" y2="-3" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="2" x2="-8" y2="2" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="7" x2="-8" y2="7" stroke="#3498db" stroke-width="1" opacity="0.5"/>

    <!-- Right page lines -->
    <line x1="8" y1="-8" x2="20" y2="-8" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="-3" x2="20" y2="-3" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="2" x2="20" y2="2" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="7" x2="20" y2="7" stroke="#3498db" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
